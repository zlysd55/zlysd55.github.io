<style>

  .card {

    border-radius: 22px;
    background: rgba(13, 20, 32, 0.62);
    border: 1px solid rgba(120, 180, 240, 0.14);

  }
  .name {
    font-size: 34px;
    font-weight: 650;
    letter-spacing: 0.04em;
    background: linear-gradient(100deg, #cfe6ff 0%, #7fb8f0 55%, #4f93d6 100%);

    background-clip: text;
    color: transparent;
  }
  .tag {
    margin-top: 12px;
    font-size: 14px;
    letter-spacing: 0.08em;
    color: #7d9bb8;
  }
  .rule {
    height: 1px;
    margin: 28px 0;
    background: linear-gradient(90deg, rgba(120, 180, 240, 0.35), rgba(120, 180, 240, 0.04));
  }
  .intro {
    font-size: 15.5px;
    line-height: 1.9;
    color: #a9bed4;
  }
  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 34px;
  }
  .links a {
    display: inline-flex;
    align-items: center;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 14px;
    text-decoration: none;
    color: #cfe3f7;
    background: rgba(90, 150, 210, 0.10);
    border: 1px solid rgba(120, 180, 240, 0.20);
    transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
  }
  .links a:hover {
    background: rgba(90, 150, 210, 0.20);
    border-color: rgba(140, 200, 255, 0.42);
    transform: translateY(-1px);
  }
  footer {
    margin-top: 30px;
    font-size: 12.5px;
    color: #5b7188;
    letter-spacing: 0.03em;

  @media (max-width: 520px) {
